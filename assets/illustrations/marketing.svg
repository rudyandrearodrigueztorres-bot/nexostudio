<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" class="w-full h-auto">
  <!-- 1. Remolino dinámico amarillo neón de fondo (El Nexo) -->
  <path d="M110,340 C60,420 180,470 320,450 C460,430 540,350 510,210 C480,90 350,50 230,80 C110,110 50,220 110,340 Z" fill="#E6FF00" fill-opacity="0.95"/>
  <path d="M300,70 C410,50 510,120 480,240 C450,340 330,420 210,400 C110,380 90,270 170,180 C230,110 210,80 300,70 Z" fill="#12180F" fill-opacity="0.04"/>

  <!-- 2. Líneas orgánicas de conexión de la red ("el nexo") -->
  <path d="M300,240 C220,210 180,160 140,170" stroke="#12180F" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M340,230 C400,190 430,150 480,180" stroke="#12180F" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M290,270 C240,310 180,350 140,330" stroke="#12180F" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M350,280 C410,320 460,330 490,290" stroke="#12180F" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- 3. FIGURA CENTRAL (GRANDE): Sujeta el móvil del que emana la red -->
  <!-- Piernas y zapatos grandes de la figura central -->
  <path d="M250,380 L270,440 C270,460 220,470 190,460 C180,450 200,430 230,425 L220,380 Z" fill="#12180F"/>
  <path d="M340,380 L320,440 C320,460 370,470 400,460 C410,450 390,430 360,425 L370,380 Z" fill="#12180F"/>
  <path d="M230,290 L260,390 L300,390 L280,290 Z" fill="#3FD05A"/>
  <path d="M360,290 L330,390 L290,390 L310,290 Z" fill="#229E39"/>

  <!-- Torso amplio en azul vibrante (#6AAEFF) -->
  <path d="M230,190 C220,150 370,150 360,190 C370,250 350,300 295,300 C240,300 220,250 230,190 Z" fill="#6AAEFF"/>

  <!-- Cabeza de la figura central (piel neutra) -->
  <circle cx="295" cy="115" r="32" fill="#D9D4C7"/>
  <!-- Pelo geométrico en negro -->
  <path d="M265,115 C265,80 325,75 328,110 C310,110 295,95 275,112 Z" fill="#12180F"/>
  <!-- Rostro mínimo -->
  <path d="M290,118 L296,118" stroke="#12180F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M305,118 L311,118" stroke="#12180F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M298,128 C302,132 308,130 310,126" stroke="#12180F" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Brazos grandes envolventes sosteniendo el móvil central -->
  <path d="M235,195 C190,210 210,280 270,265 L275,245 C230,255 220,215 245,205 Z" fill="#F08AE0"/>
  <path d="M355,195 C400,210 380,280 320,265 L315,245 C360,255 370,215 345,205 Z" fill="#F08AE0"/>

  <!-- Manos grandes sosteniendo el móvil -->
  <ellipse cx="270" cy="255" rx="14" ry="11" fill="#C5BFB0"/>
  <ellipse cx="320" cy="255" rx="14" ry="11" fill="#C5BFB0"/>

  <!-- Dispositivo Móvil Central con pantalla activa -->
  <g transform="translate(265, 195)">
    <rect width="60" height="105" rx="14" fill="#12180F" stroke="#E6FF00" stroke-width="2.5" filter="drop-shadow(0 8px 16px rgba(18,24,15,0.15))"/>
    <rect x="5" y="10" width="50" height="85" rx="9" fill="#FFFFFF"/>
    <!-- Elementos de la pantalla emitiendo mensajes -->
    <rect x="12" y="20" width="26" height="8" rx="4" fill="#6AAEFF"/>
    <rect x="22" y="32" width="26" height="8" rx="4" fill="#3FD05A"/>
    <circle cx="20" cy="50" r="5" fill="#F0605A"/>
    <circle cx="34" cy="50" r="5" fill="#F08AE0"/>
    <rect x="12" y="62" width="36" height="6" rx="3" fill="#12180F" fill-opacity="0.15"/>
    <circle cx="30" cy="84" r="5" fill="#E6FF00" stroke="#12180F" stroke-width="1.5"/>
  </g>

  <!-- 4. BURBUJAS, CORAZONES Y ESTRELLAS QUE SALEN DEL MÓVIL HACIA LA RED -->
  <!-- Corazón grande flotante en coral (#F0605A) -->
  <g transform="translate(230, 160) scale(0.9)">
    <path d="M12,5 C8,0 0,2 0,10 C0,17 12,25 12,25 C12,25 24,17 24,10 C24,2 16,0 12,5 Z" fill="#F0605A" stroke="#12180F" stroke-width="1.5"/>
  </g>

  <!-- Corazón pequeño en rosa (#F08AE0) -->
  <g transform="translate(345, 175) scale(0.75)">
    <path d="M12,5 C8,0 0,2 0,10 C0,17 12,25 12,25 C12,25 24,17 24,10 C24,2 16,0 12,5 Z" fill="#F08AE0" stroke="#12180F" stroke-width="1.5"/>
  </g>

  <!-- Estrellas brillantes en amarillo neón (#E6FF00) con trazo fino -->
  <path d="M210,130 L213,138 L221,141 L213,144 L210,152 L207,144 L199,141 L207,138 Z" fill="#E6FF00" stroke="#12180F" stroke-width="1.5"/>
  <path d="M380,140 L382,146 L388,148 L382,150 L380,156 L378,150 L372,148 L378,146 Z" fill="#E6FF00" stroke="#12180F" stroke-width="1.5"/>
  <path d="M300,60 L302,66 L308,68 L302,70 L300,76 L298,70 L292,68 L298,66 Z" fill="#E6FF00" stroke="#12180F" stroke-width="1.5"/>

  <!-- Burbujas de mensaje / diálogo conectadas -->
  <g transform="translate(255, 135)">
    <rect width="36" height="22" rx="11" fill="#FFFFFF" stroke="#12180F" stroke-width="2"/>
    <path d="M10,22 L8,28 L16,22 Z" fill="#FFFFFF" stroke="#12180F" stroke-width="2"/>
    <circle cx="14" cy="11" r="2" fill="#3FD05A"/>
    <circle cx="20" cy="11" r="2" fill="#3FD05A"/>
    <circle cx="26" cy="11" r="2" fill="#3FD05A"/>
  </g>

  <g transform="translate(310, 145)">
    <rect width="40" height="22" rx="11" fill="#12180F"/>
    <circle cx="16" cy="11" r="2" fill="#E6FF00"/>
    <circle cx="22" cy="11" r="2" fill="#E6FF00"/>
    <circle cx="28" cy="11" r="2" fill="#E6FF00"/>
  </g>

  <!-- 5. FIGURAS PEQUEÑAS DE LA RED (EL NEXO CONECTADO) -->
  <!-- Figura Pequeña 1 (Izquierda superior): Recibe un mensaje -->
  <g transform="translate(60, 120)">
    <!-- Cuerpo en coral (#F0605A) -->
    <path d="M40,70 C30,45 80,45 70,70 C75,95 35,95 40,70 Z" fill="#F0605A"/>
    <!-- Cabeza -->
    <circle cx="55" cy="30" r="16" fill="#D9D4C7"/>
    <path d="M42,28 C42,12 68,10 68,26 Z" fill="#12180F"/>
    <path d="M52,32 L56,32" stroke="#12180F" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Brazo estirado recibiendo la conexión -->
    <path d="M65,55 C80,50 95,65 105,60" stroke="#F08AE0" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="108" cy="60" r="5" fill="#C5BFB0"/>
    <!-- Burbuja flotante cerca de la figura -->
    <rect x="75" y="10" width="28" height="18" rx="9" fill="#FFFFFF" stroke="#12180F" stroke-width="1.5"/>
    <path d="M84,19 L88,14 L94,17" stroke="#3FD05A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Figura Pequeña 2 (Izquierda inferior): Conectada con brazos grandes -->
  <g transform="translate(70, 270)">
    <!-- Cuerpo en negro (#12180F) -->
    <path d="M40,65 C30,45 75,45 65,65 C70,90 35,90 40,65 Z" fill="#12180F"/>
    <!-- Piernas en verde (#3FD05A) -->
    <path d="M38,85 L30,115 L45,115 L50,85 Z" fill="#3FD05A"/>
    <path d="M52,85 L60,115 L75,115 L62,85 Z" fill="#3FD05A"/>
    <!-- Zapatos grandes -->
    <ellipse cx="25" cy="118" rx="10" ry="5" fill="#12180F"/>
    <ellipse cx="78" cy="118" rx="10" ry="5" fill="#12180F"/>
    <!-- Cabeza -->
    <circle cx="52" cy="30" r="15" fill="#ECE8DE"/>
    <path d="M40,25 C45,15 65,15 65,26 Z" fill="#F08AE0"/>
    <!-- Manos alzadas con corazón -->
    <path d="M42,50 C30,35 45,20 52,15" stroke="#F0605A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="52" cy="12" r="4" fill="#F0605A"/>
  </g>

  <!-- Figura Pequeña 3 (Derecha superior): Recibiendo estrellas de la red -->
  <g transform="translate(440, 130)">
    <!-- Cuerpo en verde (#3FD05A) -->
    <path d="M35,65 C25,45 70,45 60,65 C65,90 30,90 35,65 Z" fill="#3FD05A"/>
    <!-- Cabeza -->
    <circle cx="48" cy="28" r="16" fill="#D9D4C7"/>
    <path d="M36,25 C36,10 60,10 60,25 Z" fill="#12180F"/>
    <path d="M46,30 L50,30" stroke="#12180F" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Brazo sosteniendo mini tablet/pantalla -->
    <path d="M38,55 C20,50 15,65 10,60" stroke="#6AAEFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="-2" y="48" width="16" height="22" rx="4" fill="#FFFFFF" stroke="#12180F" stroke-width="1.5"/>
    <rect x="2" y="52" width="8" height="3" rx="1.5" fill="#F08AE0"/>
    <rect x="2" y="58" width="6" height="2" rx="1" fill="#3FD05A"/>
  </g>

  <!-- Figura Pequeña 4 (Derecha inferior): Recibiendo la conexión del nexo -->
  <g transform="translate(450, 260)">
    <!-- Cuerpo en rosa (#F08AE0) con acento coral (#F0605A) -->
    <path d="M40,65 C30,45 75,45 65,65 C70,90 35,90 40,65 Z" fill="#F08AE0"/>
    <!-- Piernas en negro -->
    <path d="M40,85 L35,115 L48,115 L50,85 Z" fill="#12180F"/>
    <path d="M55,85 L60,115 L73,115 L65,85 Z" fill="#12180F"/>
    <ellipse cx="32" cy="118" rx="9" ry="5" fill="#12180F"/>
    <ellipse cx="75" cy="118" rx="9" ry="5" fill="#12180F"/>
    <!-- Cabeza -->
    <circle cx="52" cy="30" r="15" fill="#D9D4C7"/>
    <path d="M40,24 C45,12 64,15 64,26 Z" fill="#6AAEFF"/>
    <!-- Mano grande saludando / conectando -->
    <path d="M60,50 C75,40 85,25 90,20" stroke="#F0605A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="92" cy="18" rx="6" ry="5" fill="#C5BFB0"/>
    <circle cx="102" cy="12" r="3" fill="#E6FF00"/>
  </g>

  <!-- Nodos de conexión circulares en los extremos de la red -->
  <circle cx="150" cy="170" r="6" fill="#3FD05A" stroke="#12180F" stroke-width="2"/>
  <circle cx="470" cy="180" r="6" fill="#6AAEFF" stroke="#12180F" stroke-width="2"/>
  <circle cx="145" cy="330" r="6" fill="#F08AE0" stroke="#12180F" stroke-width="2"/>
  <circle cx="485" cy="290" r="6" fill="#F0605A" stroke="#12180F" stroke-width="2"/>
</svg>